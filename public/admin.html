<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Dept of Civil Engineering</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-blue: #0A2540; --accent-blue: #0066FF; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--primary-blue); color: #fff; min-height: 100vh; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }

        /* Login Card */
        #loginBox {
            max-width: 400px;
            margin: 80px auto;
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }
        #loginBox img { width: 80px; margin-bottom: 15px; }
        #loginBox h2 { color: var(--primary-blue); margin-bottom: 20px; }
        #loginBox input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
        }
        #loginBox button {
            width: 100%;
            padding: 12px;
            background: var(--accent-blue);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* Dashboard View */
        #dashboard { display: none; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; background: #fff; color: #333; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #1e293b; color: #fff; }
        .passport-img { width: 40px; height: 40px; object-fit: cover; border-radius: 50%; }
    </style>
</head>
<body>
<div class="container">
    
    <!-- Secure Login Form -->
    <div id="loginBox">
        <img src="/logo.png" alt="ACES Logo">
        <h2>Admin Access Restricted</h2>
        <form id="adminLoginForm">
            <input type="password" id="adminKey" placeholder="Enter Admin Password" required>
            <button type="submit"><i class="fas fa-lock"></i> Authorize Login</button>
        </form>
        <p id="loginError" style="color: red; margin-top: 10px; font-size: 0.9rem;"></p>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard">
        <div class="header">
            <h2>Registered Civil Students</h2>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <input type="text" id="searchInput" placeholder="Search name or reg no..." onkeyup="filterStudents()" style="padding: 8px 12px; border-radius: 6px; border: none; width: 220px;" />
                <button onclick="exportToCSV()" style="background: #10b981; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">📥 Export CSV</button>
                <button onclick="logoutAdmin()" style="background: #dc2626; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">Logout</button>
            </div>
        </div>
        
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Photo</th>
                        <th>Name</th>
                        <th>Reg No</th>
                        <th>Level</th>
                        <th>Course</th>
                        <th>Email</th>
                        <th>Phone</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody"></tbody>
            </table>
        </div>
    </div>

</div>

<script>
let allStudents = [];
const loginForm = document.getElementById('adminLoginForm');

if (sessionStorage.getItem('adminAuth')) {
    loadDashboard(sessionStorage.getItem('adminAuth'));
}

loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const key = document.getElementById('adminKey').value;
    loadDashboard(key);
});

async function loadDashboard(key) {
    const errDiv = document.getElementById('loginError');
    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: key })
        });
        
        const data = await res.json();

        if (!data.success) {
            errDiv.innerText = data.message || "Invalid Admin Password";
            sessionStorage.removeItem('adminAuth');
            return;
        }

        sessionStorage.setItem('adminAuth', key);
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        
        allStudents = data.students;
        renderTable(allStudents);

    } catch (err) {
        errDiv.innerText = "Connection failed.";
        console.error(err);
    }
}

function renderTable(students) {
    const tbody = document.getElementById('studentTableBody');
    tbody.innerHTML = '';
    
    if (students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding: 20px;">No students found.</td></tr>`;
        return;
    }

    students.forEach(student => {
        tbody.innerHTML += `
            <tr>
                <td>${student.id}</td>
                <td><img src="${student.passport_path}" class="passport-img" /></td>
                <td>${student.name}</td>
                <td>${student.reg_number}</td>
                <td>${student.level}</td>
                <td>${student.course || 'N/A'}</td>
                <td>${student.email}</td>
                <td>${student.phone}</td>
            </tr>
        `;
    });
}

function filterStudents() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allStudents.filter(s => 
        s.name.toLowerCase().includes(query) || 
        s.reg_number.toLowerCase().includes(query)
    );
    renderTable(filtered);
}

function exportToCSV() {
    if (allStudents.length === 0) {
        alert("No data available to export.");
        return;
    }

    let csvContent = "data:text/csv;charset=utf-8,ID,Name,Reg Number,Level,Course,Email,Phone\n";
    
    allStudents.forEach(s => {
        let row = [s.id, `"${s.name}"`, s.reg_number, s.level, `"${s.course || 'N/A'}"`, s.email, s.phone];
        csvContent += row.join(",") + "\n";
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", "Civil_Engineering_Students.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function logoutAdmin() {
    sessionStorage.removeItem('adminAuth');
    location.reload();
}
</script>
</body>
</html>
